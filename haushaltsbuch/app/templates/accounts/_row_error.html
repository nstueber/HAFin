{% from "_icons.html" import pencil %}
<tr id="account-row-{{ account.id }}">
  <td class="font-medium text-gray-900 dark:text-gray-100">{{ account.display_name }}</td>
  <td class="font-mono text-xs">{{ account.iban|format_iban }}</td>
  <td>{{ account.bank_name or "–" }}</td>
  <td class="text-right">
    <div class="flex items-center justify-end gap-2">
      <span class="text-xs text-red-600 dark:text-red-400">{{ error }}</span>
      <a href="/accounts/{{ account.id }}/edit" class="btn-ghost-icon" aria-label="Bearbeiten">
        {{ pencil() }}
      </a>
    </div>
  </td>
</tr>
