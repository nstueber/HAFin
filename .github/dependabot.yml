# Dependabot: woechentliche Pruefung auf veraltete/unsichere Abhaengigkeiten, oeffnet dafuer
# automatisch Pull Requests. Die "Dependabot alerts"-Sicherheitswarnungen selbst sind ein
# Repo-Settings-Schalter in GitHub (Settings -> Code security -> Dependabot alerts) und muessen
# dort separat aktiviert werden - das deckt diese Datei nicht ab.
version: 2
updates:
  # requirements.txt liegt in haushaltsbuch/ (siehe README, "Repo-Struktur")
  - package-ecosystem: "pip"
    directory: "/haushaltsbuch"
    schedule:
      interval: "weekly"

  # Basis-Images im Dockerfile (aktuell alpine:3.20 fuer den Tailwind-Build-Stage,
  # python:3.12-alpine fuer das Anwendungsimage) - Dependabot liest beide FROM-Zeilen selbst.
  - package-ecosystem: "docker"
    directory: "/haushaltsbuch"
    schedule:
      interval: "weekly"
