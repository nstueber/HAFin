<tr id="transaction-row-{{ row.txn.id }}">
  <td class="whitespace-nowrap font-mono text-xs">{{ row.txn.booking_date.isoformat() }}</td>
  <td class="whitespace-nowrap text-xs">{{ row.account.display_name if row.account else "–" }}</td>
  <td class="font-medium text-gray-900 dark:text-gray-100">{{ row.txn.payee }}</td>
  <td class="max-w-xs truncate text-xs text-gray-500 dark:text-gray-400" title="{{ row.txn.purpose or '' }}">
    {{ row.txn.purpose or "–" }}
  </td>
  <td class="whitespace-nowrap text-right font-mono {{ 'text-green-600 dark:text-green-400' if row.txn.amount > 0 else '' }}">
    {{ "%.2f"|format(row.txn.amount) }}
  </td>
  <td class="min-w-[12rem]">
    <select
      name="category_id"
      class="form-input !py-1.5 !text-xs"
      hx-post="/transactions/{{ row.txn.id }}/category"
      hx-trigger="change"
      hx-target="#transaction-row-{{ row.txn.id }}"
      hx-swap="outerHTML"
    >
      <option value="" {% if not row.txn.category_id %}selected{% endif %}>– keine –</option>
      {% for opt in category_options %}
      <option value="{{ opt.id }}" {% if row.txn.category_id == opt.id %}selected{% endif %}>
        {{ "— " if opt.indent else "" }}{{ opt.label }}
      </option>
      {% endfor %}
    </select>
    {% if row.suggested_category %}
    <button
      type="button"
      class="mt-1 block text-left text-xs text-accent hover:underline"
      hx-post="/transactions/{{ row.txn.id }}/category"
      hx-target="#transaction-row-{{ row.txn.id }}"
      hx-swap="outerHTML"
      hx-vals='{"category_id": "{{ row.suggested_category.id }}"}'
    >
      Vorschlag: {{ row.suggested_category.name }} übernehmen
    </button>
    {% endif %}
  </td>
</tr>
