<tr id="account-row-{{ account.id }}">
  <td>{{ account.display_name }}</td>
  <td>{{ account.iban }}</td>
  <td>{{ account.bank_name or "–" }}</td>
  <td class="right-align">
    <a href="/accounts/{{ account.id }}/edit" class="circle transparent">
      <i>edit</i>
    </a>
    <span>{{ error }}</span>
  </td>
</tr>
