{% extends "base.html" %}

{% block content %}
<article>
  <h5>Konto bearbeiten</h5>
  {% if form_error %}
  <div class="error round padding">{{ form_error }}</div>
  {% endif %}
  <form method="post" action="/accounts/{{ account.id }}/edit">
    <div class="grid">
      <div class="s12 m4">
        <div class="field label border">
          <input type="text" name="display_name" required placeholder=" " value="{{ account.display_name }}" />
          <label>Anzeigename</label>
        </div>
      </div>
      <div class="s12 m4">
        <div class="field label border">
          <input type="text" name="iban" required placeholder=" " value="{{ account.iban }}" />
          <label>IBAN</label>
        </div>
      </div>
      <div class="s12 m4">
        <div class="field label border">
          <input type="text" name="bank_name" placeholder=" " value="{{ account.bank_name or '' }}" />
          <label>Bank (optional)</label>
        </div>
      </div>
    </div>
    <nav>
      <button type="submit">Speichern</button>
      <a href="/accounts">Abbrechen</a>
    </nav>
  </form>
</article>
{% endblock %}
