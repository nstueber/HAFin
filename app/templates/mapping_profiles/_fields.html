{% set values = values or {} %}
<form method="post" action="{{ action_url }}">
  <div>
    <label class="form-label">Name</label>
    <input type="text" name="name" required class="form-input" value="{{ values.name or '' }}" />
  </div>

  <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <div>
      <label class="form-label">Trennzeichen</label>
      <select name="delimiter" class="form-input">
        <option value="," {% if values.delimiter == ',' or not values.delimiter %}selected{% endif %}>Komma (,)</option>
        <option value=";" {% if values.delimiter == ';' %}selected{% endif %}>Semikolon (;)</option>
        <option value="&#9;" {% if values.delimiter == '\t' %}selected{% endif %}>Tab</option>
      </select>
    </div>
    <div>
      <label class="form-label">Dezimaltrennzeichen</label>
      <select name="decimal_separator" class="form-input">
        <option value="." {% if values.decimal_separator == '.' or not values.decimal_separator %}selected{% endif %}>Punkt (.)</option>
        <option value="," {% if values.decimal_separator == ',' %}selected{% endif %}>Komma (,)</option>
      </select>
    </div>
    <div>
      <label class="form-label">Zeichenkodierung</label>
      <select name="encoding" class="form-input">
        <option value="utf-8" {% if values.encoding == 'utf-8' or not values.encoding %}selected{% endif %}>UTF-8</option>
        <option value="windows-1252" {% if values.encoding == 'windows-1252' %}selected{% endif %}>Windows-1252</option>
        <option value="iso-8859-1" {% if values.encoding == 'iso-8859-1' %}selected{% endif %}>ISO-8859-1</option>
      </select>
    </div>
    <div>
      <label class="form-label">Datumsformat</label>
      <input type="text" name="date_format" required class="form-input" value="{{ values.date_format or '%Y-%m-%d' }}" />
    </div>
    <div>
      <label class="form-label">Kopfzeile (Zeilennummer, 1-basiert)</label>
      <input type="number" name="header_row_index_display" min="1" class="form-input"
             value="{{ (values.header_row_index or 0) + 1 }}"
             oninput="document.getElementById('header_row_index').value = Math.max(0, (parseInt(this.value, 10) || 1) - 1)" />
      <input type="hidden" id="header_row_index" name="header_row_index" value="{{ values.header_row_index or 0 }}" />
      <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
        Zeilen davor (z.B. Metadaten-Präambel) werden beim Einlesen übersprungen.
      </p>
    </div>
  </div>

  <p class="mt-6 text-sm font-medium text-gray-700 dark:text-gray-300">
    CSV-Spaltennamen (aus der Kopfzeile der CSV-Datei):
  </p>
  <div class="mt-3 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <div>
      <label class="form-label">Buchungsdatum</label>
      <input type="text" name="date_column" required class="form-input" value="{{ values.date_column or '' }}" />
    </div>
    <div>
      <label class="form-label">Auftraggeber/Empfänger</label>
      <input type="text" name="payee_column" required class="form-input" value="{{ values.payee_column or '' }}" />
    </div>
    <div>
      <label class="form-label">Verwendungszweck</label>
      <input type="text" name="purpose_column" required class="form-input" value="{{ values.purpose_column or '' }}" />
    </div>
    <div>
      <label class="form-label">Betrag</label>
      <input type="text" name="amount_column" required class="form-input" value="{{ values.amount_column or '' }}" />
    </div>
  </div>

  <div class="mt-5 flex items-center gap-3">
    <button type="submit" class="btn-primary">{{ submit_label }}</button>
    {% if cancel_url %}<a href="{{ cancel_url }}" class="btn-outline">Abbrechen</a>{% endif %}
  </div>
</form>
