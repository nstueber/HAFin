{% set values = values or {} %}
<form method="post" action="{{ action_url }}">
  <div class="field label border">
    <input type="text" name="name" required placeholder=" " value="{{ values.name or '' }}" />
    <label>Name</label>
  </div>

  <div class="grid">
    <div class="s12 m6 l3">
      <div class="field label border">
        <select name="delimiter" class="active">
          <option value="," {% if values.delimiter == ',' or not values.delimiter %}selected{% endif %}>Komma (,)</option>
          <option value=";" {% if values.delimiter == ';' %}selected{% endif %}>Semikolon (;)</option>
        </select>
        <label class="active">Trennzeichen</label>
      </div>
    </div>
    <div class="s12 m6 l3">
      <div class="field label border">
        <select name="decimal_separator" class="active">
          <option value="." {% if values.decimal_separator == '.' or not values.decimal_separator %}selected{% endif %}>Punkt (.)</option>
          <option value="," {% if values.decimal_separator == ',' %}selected{% endif %}>Komma (,)</option>
        </select>
        <label class="active">Dezimaltrennzeichen</label>
      </div>
    </div>
    <div class="s12 m6 l3">
      <div class="field label border">
        <select name="encoding" class="active">
          <option value="utf-8" {% if values.encoding == 'utf-8' or not values.encoding %}selected{% endif %}>UTF-8</option>
          <option value="iso-8859-1" {% if values.encoding == 'iso-8859-1' %}selected{% endif %}>ISO-8859-1</option>
        </select>
        <label class="active">Zeichenkodierung</label>
      </div>
    </div>
    <div class="s12 m6 l3">
      <div class="field label border">
        <input type="text" name="date_format" required placeholder=" " value="{{ values.date_format or '%Y-%m-%d' }}" />
        <label>Datumsformat</label>
      </div>
    </div>
  </div>

  <p>CSV-Spaltennamen (aus der Kopfzeile der CSV-Datei):</p>
  <div class="grid">
    <div class="s12 m6 l3">
      <div class="field label border">
        <input type="text" name="date_column" required placeholder=" " value="{{ values.date_column or '' }}" />
        <label>Buchungsdatum</label>
      </div>
    </div>
    <div class="s12 m6 l3">
      <div class="field label border">
        <input type="text" name="payee_column" required placeholder=" " value="{{ values.payee_column or '' }}" />
        <label>Auftraggeber/Empfänger</label>
      </div>
    </div>
    <div class="s12 m6 l3">
      <div class="field label border">
        <input type="text" name="purpose_column" required placeholder=" " value="{{ values.purpose_column or '' }}" />
        <label>Verwendungszweck</label>
      </div>
    </div>
    <div class="s12 m6 l3">
      <div class="field label border">
        <input type="text" name="amount_column" required placeholder=" " value="{{ values.amount_column or '' }}" />
        <label>Betrag</label>
      </div>
    </div>
  </div>

  <nav>
    <button type="submit">{{ submit_label }}</button>
    {% if cancel_url %}<a href="{{ cancel_url }}">Abbrechen</a>{% endif %}
  </nav>
</form>
